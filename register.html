<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="mobile-screen">
        <div class="center-content">
            <div class="login-image">
                <img src="" alt="Registro">
            </div>

            <form id="register-form">
                <h1 class="login-title">Crear cuenta</h1>
                <p class="login-subtitle">Regístrate para comenzar a usar la app</p>

                <div class="form-group">
                    <label>Primer nombre</label>
                    <input type="text" id="register-first-name" placeholder="Primer nombre" required>
                </div>

                <div class="form-group">
                    <label>Segundo nombre (opcional)</label>
                    <input type="text" id="register-second-name" placeholder="Segundo nombre">
                </div>

                <div class="form-group">
                    <label>Apellidos</label>
                    <input type="text" id="register-last-name" placeholder="Apellidos" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="register-email" placeholder="Ejemplo@gmail.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="register-password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div class="form-group">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="register-confirm-password" placeholder="Repite tu contraseña" minlength="8" required>
                </div>

                <div class="terms-container">
                    <label class="terms-label">
                        <input type="checkbox" id="terms" required>
                        Aceptar los
                        <a href="terms.html" target="_blank" rel="noopener noreferrer">terminos y condiciones</a>
                        de SmartSip
                    </label>
                </div>

                <div class="login-buttons">
                    <button type="submit" class="btn btn-dark">Crear Cuenta</button>
                    <button type="button" class="btn btn-light" onclick="location.href='login.html'">Iniciar Sesión</button>
                </div>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="register.js"></script>
</body>
</html>

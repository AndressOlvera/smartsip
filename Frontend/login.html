<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="mobile-screen">
        <div class="center-content">
            <div class="login-image">
                <img src="imgs/login.png" alt="Bienvenida">
            </div>

            <form id="login-form">
                <h1 class="login-title">Bienvenido 👋</h1>
                <p class="login-subtitle">Inicia sesión y sigue hidratándote</p>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="Ejemplo@email.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div class="login-buttons">
                    <button type="submit" class="btn btn-dark">Iniciar Sesión</button>
                    <button type="button" class="btn btn-light" onclick="location.href='register.html'">Registrarse</button>
                </div>
            </form>
        </div>
    </div>

    <script src="common.js"></script>
    <script src="login.js"></script>
</body>
</html>

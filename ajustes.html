<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ajustes</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #e5e5e5;
  padding-bottom: 100px;
}

/* HEADER */
.header {
  background: black;
  color: white;
  padding: 30px 20px 40px;
  border-bottom-left-radius: 40px;
  border-bottom-right-radius: 40px;
}

.back {
  background: #777;
  width: 45px;
  height: 45px;
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  margin-bottom: 20px;
}

.header h1 {
  margin: 0;
  font-size: 28px;
}

/* LIST */
.list {
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
}

/* ITEM */
.item {
  background: #dcdcdc;
  padding: 15px 20px;
  border-radius: 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* LEFT SIDE */
.left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.icon {
  background: #eee;
  width: 40px;
  height: 40px;
  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;
}

/* ARROW */
.arrow {
  font-size: 20px;
}

/* TOGGLE */
.toggle {
  width: 50px;
  height: 28px;
  background: #ffa000;
  border-radius: 20px;
  position: relative;
}

.toggle::after {
  content: "";
  width: 22px;
  height: 22px;
  background: white;
  border-radius: 50%;
  position: absolute;
  right: 3px;
  top: 3px;
}

/* NAVBAR */
.nav {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;

  background: #4f6670;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
  color: white;
}

.nav div {
  text-align: center;
  font-size: 12px;
}

.active-nav {
  color: black;
}
</style>

</head>

<body>

<!-- HEADER -->
<div class="header">
  <div class="back">←</div>
  <h1>Ajustes de cuenta</h1>
</div>

<!-- LIST -->
<div class="list">

  <div class="item">
    <div class="left">
      <div class="icon">🔔</div>
      <span>Notificaciones</span>
    </div>
    <div class="arrow">›</div>
  </div>

  <div class="item">
    <div class="left">
      <div class="icon">👤</div>
      <span>Información personal</span>
    </div>
    <div class="arrow">›</div>
  </div>

  <div class="item">
    <div class="left">
      <div class="icon">📞</div>
      <span>Servicio al cliente</span>
    </div>
    <div class="arrow">›</div>
  </div>

  <div class="item">
    <div class="left">
      <div class="icon">🏳️</div>
      <span>Modo oscuro</span>
    </div>
    <div class="toggle"></div>
  </div>

  <div class="item">
    <div class="left">
      <div class="icon">⌚</div>
      <span>Botes conectados</span>
    </div>
    <div class="arrow">›</div>
  </div>

</div>

<!-- NAVBAR -->
<div class="nav">
  <div>🏠<p>Inicio</p></div>
  <div>💧<p>Consumo</p></div>
  <div>⛶<p>Agregar</p></div>
  <div>🎯<p>Objetivos</p></div>
  <div class="active-nav">⚙️<p>Ajustes</p></div>
</div>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">

    <script>
        function toggleForms() {
            let formLogin = document.getElementById("LOGIN");
            let formRegistro = document.getElementById("REGISTRO");

            if (formRegistro.style.display == "none") {
                formLogin.style.display = "none";
                formRegistro.style.display = "block";
            } else {
                formLogin.style.display = "block";
                formRegistro.style.display = "none";
            }
        }
        function validarPasswords() {
            let password = document.getElementById("register-password");
            let confirmPassword = document.getElementById("register-confirm-password");

            confirmPassword.setCustomValidity("");

            if (password.value != confirmPassword.value) {
                confirmPassword.setCustomValidity("Las contraseñas no coinciden");
                confirmPassword.reportValidity();
                return false;
            }
            return true;
        }
    </script>
</head>
<body>
    <div class="mobile-screen">
        <div class="center-content">
            <div class="login-image">
                <img src="imgs/" alt="la imagen">
            </div>

            <!-- LOGIN -->
            <form id="LOGIN" action="javascript:alert('Inicio de sesion exitoso')">
                <h1 class="login-title">Bienvenido! 👋</h1>
                <p class="login-subtitle">Inicia sesión y sigue hidratándote</p>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="login-email" placeholder="Ejemplo@email.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="login-password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div class="login-buttons">
                    <button type="submit" class="btn btn-dark">Iniciar Sesión</button>
                    <button type="button" class="btn btn-light" onclick="toggleForms()">Registrarse</button>
                </div>
            </form>

            <!-- REGISTRO -->
            <form id="REGISTRO" action="javascript:alert('Registro exitoso')" style="display:none;" onsubmit="return validarPasswords()">
                <h1 class="login-title">Crear cuenta</h1>
                <p class="login-subtitle">Regístrate para comenzar a usar la app</p>

                <div class="form-group">
                    <label>Nombre</label>
                    <input type="text" id="register-name" placeholder="Tu nombre completo" required>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="register-email" placeholder="Ejemplo@email.com" required>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="register-password" placeholder="Mínimo 8 caracteres" minlength="8" required>
                </div>

                <div class="form-group">
                    <label>Confirmar contraseña</label>
                    <input type="password" id="register-confirm-password" placeholder="Repite tu contraseña" minlength="8" required>
                </div>

                <div class="terms-container">
                    <label class="terms-label">
                        <input type="checkbox" id="terms" required>
                        Aceptar los
                        <a href="terms.html" target="_blank">terminos y condiciones</a>
                        de SmartSip
                    </label>
                </div>

                <div class="login-buttons">
                    <button type="submit" class="btn btn-dark">Crear Cuenta</button>
                    <button type="button" class="btn btn-light" onclick="toggleForms()">Iniciar Sesión</button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
